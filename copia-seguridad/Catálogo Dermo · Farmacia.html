 {"id": "limpiadores", "name": "Limpiadores Faciales", "d": "Tensoactivos, tipos de limpiadores y doble limpieza.", "t": "## ¿Por qué es importante la limpieza facial?\nLa piel actúa como un escudo frente a microorganismos y agentes externos. Para mantenerla sana, la limpieza es esencial: si no se realiza correctamente, se altera el equilibrio de la microbiota y ciertos microorganismos pueden degradar la suciedad acumulada, generando mal olor.\nSobre la piel se acumulan sustancias oleosas del sebo, restos proteicos del sudor, células muertas, contaminación ambiental y residuos cosméticos como maquillaje o protector solar. El agua por sí sola solo elimina restos hidrosolubles, pero no la suciedad lipófila, por lo que se necesitan limpiadores específicos.\n## ¿Qué son los tensoactivos?\nLos tensoactivos son moléculas anfifílicas: una parte atrae el agua y otra atrae las grasas. Esta estructura les permite rodear la suciedad y retirarla mediante micelas, que se forman cuando el tensoactivo alcanza la concentración micelar crítica (CMC).\nTambién se clasifican según su solubilidad mediante el HLB (balance hidrófilo-lipófilo), que determina si actúan como humectantes, emulsionantes, detergentes o solubilizantes.\n## Tipos de tensoactivos\nExisten cuatro grandes grupos, cada uno con propiedades distintas. En la práctica, los limpiadores suelen combinar varios para equilibrar eficacia y tolerancia.\n### Aniónicos\nSon los más espumantes. Incluyen jabones, sulfatos (como SLS y SLES), sulfonatos y acil-aminoácidos. Algunos pueden ser irritantes si se usan solos, por lo que se combinan con otros más suaves.\n### Catiónicos\nTienen carga positiva y se usan sobre todo en productos capilares por su efecto acondicionador. No suelen emplearse como limpiadores faciales principales.\n### Anfóteros\nMuy suaves y bien tolerados. Se adaptan al pH y reducen la irritación de los aniónicos. Son habituales en limpiadores para piel sensible.\n### No iónicos\nNo se ionizan en agua y son los más respetuosos con la piel. Se usan en aguas micelares, leches limpiadoras y productos para piel sensible.\n## Funciones cosméticas de los tensoactivos\nSegún la base CosIng, pueden actuar como limpiadores, dispersantes, emulsionantes, espumantes, hidrótropos o solubilizantes. Su función principal en la limpieza es formar micelas que atrapan la suciedad grasa.\nEs importante recordar que **la cantidad de espuma no determina la capacidad de limpieza**.\n## Formas cosméticas de limpieza\n### Soluciones micelares\nContienen tensoactivos no iónicos que forman micelas capaces de atrapar grasa, maquillaje y polución. No requieren aclarado, aunque depende de la fórmula. Son ideales como segundo paso en la doble limpieza.\n### Aceites limpiadores\nDisuelven la suciedad lipófila y se transforman en emulsión al contacto con el agua. Son suaves y muy útiles en piel seca o como primer paso nocturno.\n### Leches limpiadoras\nSe aplican en seco y se retiran con algodón. Limpian por disolución y son ideales para piel seca o sensible.\n### Emulsiones limpiadoras al agua\nCombinan tensoactivos suaves con emolientes. Se aclaran con agua y limpian sin dejar sensación de tirantez.\n### Geles limpiadores\nGeneran espuma ligera y se aclaran con agua. Son ideales para piel grasa o con tendencia acneica.\n### Syndets\n“Jabones sin jabón” formulados con tensoactivos suaves que no elevan el pH de la piel. Son una alternativa respetuosa a las pastillas de jabón tradicionales.\n### Toallitas desmaquillantes\nContienen tensoactivos no iónicos, pero su capacidad de limpieza es limitada. Solo deben usarse de forma puntual.\n## Exfoliantes y mascarillas de limpieza\n### Exfoliantes físicos\nEliminan células muertas mediante fricción. No se recomiendan en piel sensible, rosácea o acné inflamatorio.\n### Exfoliantes químicos\nIncluyen AHA, BHA y PHA. Rompen las uniones entre corneocitos y mejoran textura, luminosidad y poros.\n### Exfoliantes enzimáticos\nMás suaves, basados en enzimas como papaína o bromelaína. Ideales para piel sensible.\n### Mascarillas de limpieza\nPueden ser de arcilla, carbón, peel-off o tipo “goma de borrar”. Adsorben sebo y suciedad, y mejoran la apariencia de los poros.\n## Rutina de limpieza\n### Limpieza matinal\nPor la mañana basta un solo paso para retirar secreciones nocturnas. En piel grasa funcionan mejor los limpiadores jabonosos; en piel seca, las emulsiones o aceites.\n### Limpieza nocturna\nDebe realizarse una **doble limpieza**:\n- **Primer paso:** aceite o bálsamo para retirar maquillaje y protector solar.\n- **Segundo paso:** limpiador acuoso para eliminar restos hidrosolubles y polución.\nEs fundamental retirar bien el protector solar y el maquillaje resistente."},
 {"id": "contorno", "name": "Contorno de Ojos", "d": "Bolsas, ojeras, quistes de milium y aplicación.", "t": "## ¿Por qué la piel del contorno es diferente?\nLa piel que rodea los ojos es más fina, sensible y delicada que la del resto del rostro. Tiene menos glándulas sebáceas, una red de colágeno y elastina más frágil y una circulación linfática y vascular muy activa. Además, parpadeamos miles de veces al día, lo que acelera la aparición de arrugas, flacidez, bolsas y ojeras.\nEsta zona se deshidrata con facilidad y es más vulnerable a irritaciones y signos de envejecimiento. Por eso, necesita productos específicos y técnicas de aplicación adecuadas.\n## Tipos de bolsas\n### Bolsas de líquido\nSon las más comunes. Se deben a retención de líquidos, aumento de permeabilidad capilar y peor drenaje linfático. Suelen verse más marcadas por la mañana.\nIngredientes que pueden ayudar:\n- Hamamelis, castaño de indias, manzanilla, caléndula, té verde, ginkgo biloba, árbol de la seda.\n- Sodium Dextran Sulfate (acción antiedematosa y antioxidante).\n- Eyeseryl® (tetrapéptido que mejora circulación sanguínea y linfática).\n- Eyeliss™ (hesperidina, dipéptidos y palmitoil tetrapéptido‑7).\n- Eylide (diosmina, forskolina y palmitoil tetrapéptido‑7).\n### Bolsas de grasa\nSe producen por la herniación de la grasa orbitaria. No varían a lo largo del día y aumentan al presionar el globo ocular. Su tratamiento es quirúrgico (blefaroplastia).\n## Tipos de ojeras\n### Ojeras azuladas (vasculares)\nSe deben a fragilidad capilar, extravasación sanguínea y depósito de hemosiderina. La piel fina deja ver el tono azulado.\nIngredientes que pueden ayudar:\n- Árnica.\n- Ginkgo biloba.\n- Eye’fective™.\n- Cafeína.\n- Hamamelis, castaño de indias, manzanilla, caléndula.\n- Vitamina K óxido.\n- Unisooth EG 28.\n- Haloxyl™.\n### Ojeras marrones (melánicas)\nSe deben a un exceso de melanina.\nIngredientes que pueden ayudar:\n- Vitamina C.\n- Niacinamida.\n- Ácido tranexámico.\n- Eye’fective™.\n### Ojeras hereditarias\nSon genéticas y difíciles de mejorar solo con cosmética. Suelen requerir procedimientos médico‑estéticos.\n### Ojeras por cansancio\nMejoran con descanso adecuado y hábitos saludables.\n## Quistes de milium\nSon pequeños quistes de queratina (1–2 mm) que aparecen en párpados y mejillas por oclusión de conductos de glándulas sudoríparas o sebáceas. La radiación solar favorece su aparición.\nRecomendaciones:\n- Protección solar diaria.\n- Lociones exfoliantes con ácido salicílico.\n- Evitar productos muy oclusivos si eres propenso.\nSuelen desaparecer solos. Si no, pueden retirarse por un dermatólogo mediante electrodesecación o incisión.\n## Cómo usar correctamente el contorno de ojos\nEl contorno debe aplicarse **después de la limpieza** y **antes de activos potentes** como retinoides, vitamina C pura o glicólico, para proteger la zona de irritaciones.\nNo se recomienda usar la crema facial en esta zona, ya que la piel del contorno es más permeable y reactiva, y podría irritarse con perfumes, aceites esenciales o conservantes más concentrados.\n### Modo de aplicación\n- Aplicar sobre piel limpia y seca.\n- Colocar el producto sobre el hueso orbital, no en el párpado móvil.\n- Dar toques suaves desde el lagrimal hacia la sien, siguiendo un “ocho imaginario”.\n- Usar dedos anular y corazón para ejercer menos presión.\n- Evitar que el producto migre al interior del ojo.\n- Usar una cantidad pequeña (tamaño de un guisante por ojo).\n- En arrugas: movimientos circulares ascendentes.\n- En bolsas de líquido: presiones suaves por debajo de la bolsa.\n- Esperar unos segundos antes de maquillarse.\n### Texturas recomendadas\nLas texturas muy grasas pueden empeorar las bolsas, por lo que se prefieren geles o cremageles. Si la piel está muy deshidratada, puede aplicarse una mascarilla hidratante semanal, evitando colocarla directamente sobre la bolsa.\n### pH adecuado\nEl pH del lagrimal es 7–7,5, pero la piel del contorno es ligeramente ácida. Por eso, los productos se formulan entre **pH 5,5 y 6,5**. Un pH más alto puede irritar, aunque la irritación también puede deberse a la migración del producto hacia el ojo o a ingredientes irritantes."},
 {"id": "lociones", "name": "Lociones de Uso Diario", "d": "Exfoliantes e hidratantes.", "t": "## ¿Qué son las lociones de uso diario?\nLas lociones de uso diario son productos ligeros, normalmente en textura acuosa o gel, que se aplican después de la limpieza sobre la piel seca. No tienen función limpiadora: su objetivo es aportar hidratación, luminosidad o renovación suave.\nEn la cosmética asiática se conocen como **esencias**. Se aplican igual que un tónico, con algodón o directamente con las manos, y no requieren aclarado. Suelen contener una alta concentración de ingredientes activos.\n## Tipos de lociones\nExisten dos grandes grupos de lociones de uso diario:\n- **Lociones exfoliantes diarias**, que renuevan suavemente la piel.\n- **Lociones hidratantes diarias**, que aportan agua y refuerzan la barrera cutánea.\n## Lociones exfoliantes diarias\nEstas lociones realizan una exfoliación suave y progresiva, eliminando corneocitos superficiales y aportando luminosidad. Mejoran la textura, previenen comedones y aumentan la eficacia de los tratamientos posteriores.\n### Ingredientes habituales\n- **Alfahidroxiácidos (AHA)** como el ácido glicólico: exfolian e hidratan.\n- **Ácido salicílico (BHA)**: limpia los poros y reduce imperfecciones.\n- **Derivados del ácido azelaico** como Potassium Azeloyl Diglycinate: regulan el sebo, unifican el tono, mejoran la hidratación y estimulan el colágeno.\n### Frecuencia de uso según tipo de piel\n- **Piel grasa:** dos veces al día.\n- **Piel mixta:** mañana y/o noche, solo en zona T.\n- **Piel seca:** solo por la noche o en días alternos.\nTambién pueden utilizarse en milium o acné leve del tronco. Deben evitarse en el contorno de ojos y en comisuras para prevenir irritación.\n## Lociones hidratantes diarias\nEstas lociones aportan hidratación adicional y son aptas para cualquier tipo de piel. Su función principal es reforzar la barrera cutánea y mejorar la retención de agua.\n### Ingredientes habituales\n- **Ácido hialurónico** en diferentes pesos moleculares para hidratar en profundidad.\n- **Minerales esenciales** como calcio, magnesio, potasio y sodio, que forman parte del factor natural de hidratación.\n- **Glicerina y otros humectantes** que atraen agua hacia la epidermis.\nEstas lociones preparan la piel para recibir mejor los tratamientos posteriores y son especialmente útiles en rutinas minimalistas."},
 {"id": "antioxidantes", "name": "Antioxidantes", "d": "Vitamina C, E, niacinamida, resveratrol y más.", "t": "## ¿Por qué son importantes?\nLa piel está expuesta diariamente a radiación UV, contaminación, estrés y otros factores que generan radicales libres. Estos radicales dañan proteínas, lípidos de membrana y ADN, acelerando el envejecimiento y favoreciendo la inflamación.\nCon la edad, la capacidad antioxidante natural disminuye, por lo que la aplicación tópica de antioxidantes y antiinflamatorios es fundamental para proteger la piel, prevenir daño celular y mejorar su apariencia.\n## ¿Qué es un antioxidante?\nUn antioxidante es una molécula capaz de prevenir o frenar la oxidación. Puede actuar evitando la formación de radicales libres o neutralizándolos mediante la donación de electrones.\nAdemás, muchos antioxidantes inhiben enzimas que degradan el colágeno, como las metaloproteinasas (MMPs), ayudando a prevenir el envejecimiento prematuro.\n## Principales antioxidantes\nSe destacan los siguientes antioxidantes por su eficacia y evidencia:\n- **Carotenoides** (betacaroteno, astaxantina, vitamina A)\n- **Melatonina**\n- **Vitaminas C y E**\n- **Niacinamida**\n- **Resveratrol**\n- **Ácido ferúlico**\n- **Coenzima Q10**\n- **Silimarina**\n- **Polifenoles** (té verde, semillas de uva, pomelo, soja)\n- **Pycnogenol®**, rico en proantocianidinas\n## Vitamina C\nEs el antioxidante más abundante en la piel. Su forma más activa es el **ácido ascórbico**, que requiere un pH bajo (≈3,5) para mantenerse estable y penetrar adecuadamente.\n### Beneficios\n- Reduce el eritema inducido por UVB.\n- Estimula la síntesis de colágeno.\n- Inhibe MMPs que degradan colágeno, elastina y ácido hialurónico.\n- Actúa como despigmentante al interferir en la tirosinasa.\n- Regenera vitamina E y mejora la barrera cutánea.\n### Derivados más estables\n- **Ascorbyl Palmitate**: liposoluble, estable y no irritante.\n- **Magnesium Ascorbyl Phosphate (MAP)**: muy estable, antioxidante y despigmentante.\n- **Ascorbyl Glucoside**: estable y estimulador de colágeno.\n- **3-O-Ethyl Ascorbic Acid**: muy estable, no irritante y con excelente penetración.\n- **Formas encapsuladas** como Cellucap™ C.\n## Vitamina E\nEs el principal antioxidante liposoluble del organismo. Protege los lípidos del estrato córneo frente a la radiación UV y la contaminación.\n### Beneficios\n- Reduce el eritema solar.\n- Mejora la hidratación y suavidad de la piel.\n- Actúa sinérgicamente con la vitamina C.\nDestaca el derivado **Vital ET™**, con alta biodisponibilidad y acción antiinflamatoria.\n## Niacinamida (Vitamina B3)\nEs uno de los ingredientes más versátiles y completos. Estable, soluble en agua y con excelente penetración.\n### Beneficios\n- Reduce acné y rosácea por su acción antiinflamatoria.\n- Mejora la barrera cutánea aumentando ceramidas y filagrina.\n- Reduce rojeces e irritación.\n- Estimula colágeno y elastina.\n- Actúa como despigmentante al bloquear la transferencia de melanosomas.\n- Previene el tono amarillento por glicación.\n- Protege frente a polución y radiación UV.\nDebe formularse entre pH 4,5 y 6 para evitar su conversión a ácido nicotínico, que es irritante. La versión **Niacinamide PC** garantiza menos de 100 ppm de ácido nicotínico residual.\n## Otros antioxidantes destacados\n### Ácido ferúlico\nPotencia la síntesis de colágeno y elastina, mejora la elasticidad y reduce líneas finas. También inhibe la tirosinasa, ayudando a prevenir la pigmentación.\n### Melatonina\nPotente antioxidante y antiinflamatoria. Reduce el eritema inducido por UV y ayuda a prevenir el envejecimiento cutáneo.\n### Resveratrol\nPolifenol con acción antioxidante, antiinflamatoria y despigmentante. Protege frente a UVB y activa la sirtuina 1, relacionada con la reparación del ADN.\n### Extracto de pomelo\nRico en vitamina C y ácido cítrico. Potencia la síntesis de colágeno, inhibe MMPs y tiene propiedades antimicrobianas.\n### DMAE\nDerivado de la colina con efectos antioxidantes, antiinflamatorios y reafirmantes. Modula la contracción muscular y mejora el tono cutáneo, aunque su uso genera debate por su posible efecto sobre fibroblastos.\n## Antiinflamatorios\nLa inflamación se manifiesta como calor, dolor, enrojecimiento e hinchazón. Los cosméticos antiinflamatorios actúan inhibiendo vías como la ciclooxigenasa o la lipooxigenasa, reduciendo mediadores como prostaglandinas y leucotrienos.\n### Ingredientes antiinflamatorios más utilizados\n- Ácido salicílico\n- Extracto de chirimoya\n- Hamamelis\n- Azufre\n- Zinc gluconato\n- Árnica\n- Pepino\n- Niacinamida\n- Regaliz\n- Aloe vera\n- Salvia\n- Té verde\n- Algodón\n- Manzanilla\n- Cúrcuma\n- Cumarina\n- Caléndula\n- Avena coloidal\n- Alfabisabolol\n- Jengibre"},
 {"id": "reparadores", "name": "Reparadores de la Función Barrera", "d": "Humectantes, emolientes y lípidos esenciales.", "t": "## ¿Qué es la función barrera?\nLa función barrera es la capacidad de la piel para protegernos frente a agresiones externas y evitar la pérdida excesiva de agua. Depende principalmente del estrato córneo, formado por corneocitos y una matriz lipídica rica en ceramidas, colesterol y ácidos grasos.\nCuando esta estructura se altera —por clima, irritación, exfoliación excesiva, tratamientos médicos, estrés o envejecimiento— la piel pierde agua con facilidad, se vuelve áspera, tirante, sensible y más propensa a inflamarse. Es importante recordar que beber agua no aumenta la hidratación cutánea: la mejora real se consigue mediante ingredientes tópicos que restauren la barrera.\nUn cosmético reparador eficaz combina:\n- **Humectantes**, que atraen y retienen agua.\n- **Emolientes**, que suavizan y aportan lípidos.\n- **Ingredientes reparadores** como ceramidas, colesterol y ácidos grasos.\nAdemás, puede incluir antioxidantes, péptidos, despigmentantes o filtros solares para reforzar la piel de forma global.\n## Sustancias humectantes\nLos humectantes son moléculas higroscópicas capaces de atraer agua hacia las capas superficiales de la piel. Mejoran la hidratación inmediata y reducen la pérdida de agua transepidérmica (TEWL). Sin embargo, en concentraciones muy altas y en ambientes secos pueden extraer agua de capas más profundas, por lo que deben formularse correctamente.\n### Principales humectantes\n- **Hidroxiácidos** (ácido láctico, lactato sódico, ácido lactobiónico): hidratan y favorecen la renovación suave.\n- **Pantenol**: repara la piel irritada, mejora la función barrera y reduce la pérdida de agua.\n- **Glicerina y glicoles**: muy eficaces reteniendo agua; el propilenglicol puede irritar en pieles sensibles.\n- **Azúcares** como manitol, xilitol o sorbitol: mejoran la hidratación y el equilibrio del microbioma.\n- **Ácido poliglutámico**: retiene hasta 4 veces más agua que el ácido hialurónico.\n### Ácido hialurónico\nEl **ácido hialurónico (AH)** es uno de los ingredientes más importantes para reparar la función barrera. Es un polisacárido natural presente en la piel, capaz de retener hasta **1.000 veces su peso en agua**. Su función principal es mantener la hidratación, elasticidad y volumen cutáneo.\nEn cosmética se utiliza en diferentes pesos moleculares, cada uno con beneficios específicos:\n- **Alto peso molecular**: permanece en la superficie, formando una película protectora que reduce la pérdida de agua y calma la piel.\n- **Medio peso molecular**: hidrata capas intermedias y mejora la elasticidad.\n- **Bajo peso molecular**: penetra más profundamente, estimula la reparación y mejora la firmeza.\n- **Hialuronato sódico**: forma más estable y común, con excelente capacidad humectante.\n- **Ácido hialurónico hidrolizado**: fragmentado para mejorar la penetración y la reparación.\nEl ácido hialurónico no solo hidrata: también **reduce la inflamación**, mejora la función barrera, favorece la cicatrización y potencia la eficacia de otros activos. Es apto para todo tipo de pieles, incluidas sensibles, acneicas o con rosácea.\nSu uso continuado mejora la textura, la luminosidad y la resistencia de la piel frente a agresiones externas.\n## Sustancias emolientes\nLos emolientes aportan lípidos que rellenan los espacios entre corneocitos, suavizando la piel y reduciendo la aspereza. Son esenciales para restaurar la flexibilidad y evitar la deshidratación.\n- Aceites vegetales (jojoba, argán, almendra) y minerales.\n- Mantecas como karité o cacao.\n- Ésteres grasos, muy utilizados por su textura ligera.\n- Siliconas, que aportan suavidad sin obstruir el poro.\nLos emolientes son especialmente útiles en piel seca, irritada o con tendencia a descamación.\n## Ingredientes reparadores\nPara restaurar la barrera cutánea es fundamental reponer los lípidos naturales del estrato córneo. Los más importantes son:\n- **Ceramidas**: representan alrededor del 50 % de los lípidos del estrato córneo. Refuerzan la barrera y reducen la pérdida de agua.\n- **Colesterol**: esencial para la flexibilidad y cohesión de la barrera.\n- **Ácidos grasos**: completan la matriz lipídica y mejoran la resistencia cutánea.\nLa combinación ideal es un ratio equilibrado de **ceramidas + colesterol + ácidos grasos**, que imita la composición natural de la piel y acelera la reparación."},
 {"id": "solar", "name": "Protección Solar", "d": "Filtros, FPS, UVA, luz visible y fotodermatosis.", "t": "## Importancia de la protección solar\nLa radiación solar afecta a la piel a múltiples niveles. La radiación UV puede generar un exceso de radicales libres que dañan proteínas, lípidos y ADN, acelerando el envejecimiento cutáneo. También señala que la exposición solar influye en la síntesis de vitamina D y en la función inmunológica.\n## Vitamina D y exposición solar\nLa radiación UVB es necesaria para la síntesis de vitamina D. Sin embargo, la exposición solar sin protección no es recomendable como método para obtenerla, ya que aumenta el riesgo de daño cutáneo.\n## Sistema inmunológico y radiación solar\nLa radiación UV puede suprimir la respuesta inmunitaria de la piel. Según tu texto, esto afecta tanto a la inmunidad innata como a la adaptativa, favoreciendo infecciones, reactivación de virus y aparición de lesiones precancerosas.\n## Cabinas de rayos UVA artificiales\nEn cuanto al uso de cabinas de bronceado UVA. Estas emiten radiación que penetra profundamente en la piel, generando radicales libres y aumentando el riesgo de envejecimiento prematuro y cáncer cutáneo.\n## Parámetros de protección solar\nPara evaluar un protector solar se utilizan varios parámetros:\n- **FPS (Factor de Protección Solar)**: indica la protección frente a UVB.\n- **UVA**: se representa mediante el símbolo UVA rodeado por un círculo.\n- **PPD**: mide la protección frente a UVA persistente.\n- **Broad Spectrum**: protección de amplio espectro frente a UVB y UVA.\nLa radiación UVA penetra más profundamente y está presente durante todo el año, incluso en días nublados.\n## Tipos de filtros solares\nClasificación de los filtros solares en:\n- **Filtros físicos o minerales**: como óxido de zinc y dióxido de titanio. Reflejan y dispersan la radiación.\n- **Filtros químicos**: absorben la radiación UV y la transforman en energía no dañina.\n- **Filtros mixtos**: combinan ambos tipos para mejorar la estabilidad y la protección.\n## Fotodermatosis\nLas fotodermatosis son enfermedades desencadenadas o agravadas por la luz solar. Incluyen erupciones polimorfas, dermatitis actínica crónica y otras alteraciones. La protección solar es fundamental para prevenir brotes.\n## Reacciones de fotosensibilidad\nAlgunas sustancias pueden provocar reacciones de fotosensibilidad al combinarse con la luz solar. Estas reacciones pueden ser:\n- **Fototóxicas**: más frecuentes, causan enrojecimiento y quemadura.\n- **Fotoalérgicas**: menos comunes, implican respuesta inmunitaria.\nEntre los agentes fotosensibilizantes se encuentran ciertos medicamentos, perfumes, aceites esenciales y plantas."},
 {"id": "bronceadores", "name": "Bronceadores", "d": "Cómo funcionan y cómo aplicarlos.", "t": "## Bronceadores\nSon productos que intensifican el color de la piel de forma inmediata, pero **no generan un bronceado real**. Su efecto es cosmético y desaparece con el lavado.\nSuelen incluir pigmentos que aportan un tono más dorado o bronceado, y pueden utilizarse para unificar el tono o dar un aspecto más saludable a la piel.\n## Autobronceadores\nLos autobronceadores producen un bronceado real mediante una reacción química en la superficie de la piel. Actúan gracias a sustancias como la **DHA (dihidroxiacetona)**, que reaccionan con los aminoácidos del estrato córneo para generar compuestos coloreados.\nEste proceso no implica radiación UV, por lo que es una alternativa segura al bronceado solar o a las cabinas UVA.\n## Modo de uso de los autobronceadores\nPara obtener un resultado uniforme es importante seguir una serie de pasos:\n- 1. **Exfoliar la piel** antes de la aplicación para eliminar células muertas y evitar parches.\n- 2. **Hidratar** zonas secas como codos, rodillas y tobillos para evitar que absorban demasiado producto.\n- 3. **Aplicar el autobronceador** de forma uniforme, preferiblemente con manopla.\n- 4. **Lavar las manos** inmediatamente después de aplicarlo.\n- 5. **Evitar ducharse** durante varias horas para permitir que la reacción se complete.\nEl color suele aparecer entre 2 y 6 horas después, y dura varios días, desapareciendo a medida que se renueva el estrato córneo."},
 {"id": "despigmentantes", "name": "Despigmentantes", "d": "Tirosinasa, ácido tranexámico y más.", "t": "## ¿Qué son los despigmentantes?\nLos despigmentantes son ingredientes que ayudan a reducir manchas, unificar el tono y mejorar la luminosidad de la piel. Actúan principalmente mediante tres mecanismos: inhibir la producción de melanina, bloquear su transferencia a los queratinocitos o acelerar la renovación celular para eliminar pigmento acumulado.\n## 1. Inhibidores de la actividad tirosinasa\nLa tirosinasa es la enzima clave en la síntesis de melanina. Reducir su actividad disminuye la formación de nuevas manchas. Entre los ingredientes más utilizados se encuentran:\n- **Vitamina C**: antioxidante y despigmentante.\n- **Ácido kójico**: aclara manchas y reduce la actividad enzimática.\n- **Ácido azelaico**: útil en melasma y pigmentación postinflamatoria.\n- **Arbutina**: derivado suave de la hidroquinona.\n- **Extractos vegetales** con acción inhibidora.\n## 2. Inhibidores de la transferencia de melanosomas\nEstos ingredientes no reducen la producción de melanina, sino que impiden que los melanosomas lleguen a las capas superiores de la piel. Son especialmente útiles en manchas difusas o tono desigual.\n- **Niacinamida**: bloquea la transferencia de melanosomas.\n- **Derivados del ácido tranexámico**: regulan MITF y reducen la pigmentación.\n- **Extractos botánicos** con acción moduladora.\n## 3. Agentes exfoliantes\nLa exfoliación acelera la renovación del estrato córneo, ayudando a eliminar células pigmentadas y mejorar la luminosidad. Los más utilizados son:\n- **AHA**: glicólico, láctico, cítrico, málico, tartárico.\n- **BHA**: ácido salicílico, útil en pigmentación postinflamatoria.\n- **Exfoliantes enzimáticos**: papaína y bromelaína.\nEstos ingredientes rompen las uniones entre corneocitos, favoreciendo la descamación y la eliminación de pigmento superficial.\n## Indicaciones de uso\nLos despigmentantes se emplean en:\n- Melasma\n- Hiperpigmentación postinflamatoria\n- Manchas solares\n- Tono desigual\nPara obtener resultados es imprescindible combinarlos con protección solar diaria, ya que la radiación UV puede reactivar la pigmentación."},
 {"id": "retinoides", "name": "Retinoides", "d": "Retinol, retinal, tretinoína y protocolos.", "t": "## ¿Qué son los retinoides?\nLos retinoides son derivados de la vitamina A con una de las mayores evidencias científicas en cosmética. Actúan sobre la renovación celular, estimulan la síntesis de colágeno y mejoran la textura, luminosidad y firmeza de la piel.\nExisten cuatro formas principales: ácido retinoico, retinaldehído (RAL), retinol (ROL) y bakuchiol. Cada uno tiene distinta potencia, tolerancia y mecanismo de conversión dentro de la piel.\n## Ácido retinoico (tretinoína)\nEs la forma activa de la vitamina A y la más potente. No se considera un cosmético, sino un medicamento sujeto a prescripción médica.\nActúa directamente sin necesidad de conversión, por lo que sus efectos son rápidos y profundos, pero también puede producir irritación, descamación y sensibilidad si no se usa correctamente.\n## Retinaldehído (RAL)\nEs el retinoide cosmético más cercano al ácido retinoico. Solo necesita una conversión para transformarse en la forma activa, por lo que es más potente que el retinol pero mejor tolerado que la tretinoína.\nDestaca especialmente su eficacia en pieles con tendencia acneica y en rosácea pápulo-pustular, siempre introduciéndolo de forma progresiva según tolerancia.\n## Retinol (ROL)\nEs el retinoide cosmético más utilizado. Necesita dos conversiones para transformarse en ácido retinoico, por lo que es menos potente que el retinaldehído, pero también más tolerable.\nMejora arrugas, textura, luminosidad y firmeza. Su eficacia depende de la concentración, la estabilidad de la fórmula y el sistema de liberación (microencapsulado, glicosferas, etc.).\n## Bakuchiol\nEs un activo de origen vegetal con propiedades similares a los retinoides, pero sin su potencial irritante. No es químicamente un retinoide, pero se incluye en esta categoría por su acción sobre la renovación celular, la pigmentación y la síntesis de colágeno.\nEs una alternativa excelente para pieles sensibles o para combinar con retinoides tradicionales.\n## Cómo actúan los retinoides\nAunque cada forma tiene distinta potencia, todos comparten mecanismos comunes:\n- Aumentan la renovación celular.\n- Estimulan la síntesis de colágeno y elastina.\n- Reducen la degradación de la matriz extracelular.\n- Mejoran la textura y luminosidad.\n- Disminuyen arrugas finas y líneas de expresión.\n- Regulan la producción de sebo.\n- Mejoran la pigmentación y el tono irregular.\n## Cómo introducirlos en la rutina\nLos retinoides deben introducirse de forma progresiva para evitar irritación. La tolerancia depende del tipo de piel, la concentración y la frecuencia de uso.\n### Recomendaciones generales\n- Aplicar por la noche sobre piel completamente seca.\n- Comenzar con baja frecuencia (2–3 noches por semana) e ir aumentando según tolerancia.\n- Evitar su uso simultáneo con exfoliantes fuertes en pieles sensibles.\n- Usar hidratantes reparadoras para minimizar irritación.\n- Aplicar protección solar alta durante el día.\n## ¿Para quién están indicados?\nLos retinoides son útiles en:\n- Arrugas y líneas de expresión.\n- Pérdida de firmeza.\n- Manchas y tono irregular.\n- Textura áspera o poros dilatados.\n- Piel acneica o con tendencia a imperfecciones."},
 {"id": "hidroxiacidos", "name": "Hidroxiácidos", "d": "AHA, BHA, PHA, pH y pKa.", "t": "## ¿Qué son los hidroxiácidos?\nLos hidroxiácidos son ingredientes exfoliantes que actúan rompiendo las uniones entre los corneocitos, favoreciendo la descamación y la renovación epidérmica. Mejoran la textura, luminosidad, poros, manchas y líneas finas.\nSu eficacia depende de la concentración y del pH de la fórmula. Pueden producir un leve picor al aplicarse, especialmente en pieles sensibles o irritadas.\n## Tipos de hidroxiácidos\nExisten tres grandes grupos utilizados en cosmética: AHAs, BHAs y PHAs. Cada uno tiene propiedades específicas y se adapta a distintos tipos de piel.\n## Alfahidroxiácidos (AHA)\nLos AHA son solubles en agua y actúan principalmente en la superficie de la piel. Mejoran la hidratación, la luminosidad y la textura, y son especialmente útiles en piel seca, apagada o con manchas.\n### Ácido glicólico\nEs el AHA más conocido y uno de los más eficaces. Tiene el tamaño molecular más pequeño, lo que le permite penetrar con facilidad. Exfolia, hidrata y estimula la renovación celular.\n### Ácido láctico\nMás suave que el glicólico. Exfolia e hidrata gracias a su capacidad humectante. Adecuado para pieles sensibles o que se inician en los AHA.\n### Ácido cítrico\nExfoliante suave con propiedades antioxidantes. Suele utilizarse combinado con otros AHA.\n### Otros AHA\nIncluyen el málico y el tartárico, que aportan exfoliación ligera y suelen formar parte de mezclas.\n## Ácido salicílico (BHA)\nEl ácido salicílico es liposoluble, por lo que penetra en el interior del poro. Tiene acción queratolítica y acantolítica, siendo especialmente útil en piel grasa, con puntos negros, poros dilatados o acné.\nTambién es eficaz en pigmentación superficial y en el tratamiento de milium o acné leve del tronco.\n## Gluconolactona (PHA)\nLa gluconolactona es un polihidroxiácido con acción exfoliante suave y alta tolerancia. No irrita y aporta hidratación, antioxidantes y propiedades reparadoras.\nEs una excelente alternativa para piel sensible, rosácea o para realizar transiciones con retinoides.\n## ¿Cómo actúan los hidroxiácidos?\nSu acción principal es romper las uniones entre los corneocitos, facilitando la descamación controlada. Esto mejora la textura, la luminosidad y la eficacia de los tratamientos posteriores.\nTambién ayudan a prevenir comedones en piel acneica y a mejorar la apariencia de manchas y cicatrices superficiales.\n## Cómo utilizarlos\nLa frecuencia de uso depende del tipo de piel y del tipo de hidroxiácido:\n- **Piel grasa:** pueden usarse a diario o incluso dos veces al día en formato loción.\n- **Piel mixta:** uso diario o en días alternos, especialmente en zona T.\n- **Piel seca o sensible:** solo por la noche o en días alternos.\nDeben aplicarse sobre piel limpia y seca. Es importante evitar su uso en el contorno de ojos y comisuras para prevenir irritación.\n## Indicaciones principales\n- Textura irregular\n- Piel apagada\n- Manchas superficiales\n- Poros dilatados\n- Acné leve o comedogénico\n- Cicatrices superficiales\n- Prevención de quistes de milium"},
 {"id": "peptidos", "name": "Péptidos y factores de crecimiento", "d": "Tipos y funciones.", "t": "## ¿Qué son los péptidos?\nLos péptidos son cadenas cortas de aminoácidos capaces de actuar como mensajeros en la piel. Pueden estimular la síntesis de colágeno, mejorar la firmeza, reducir arrugas o modular la inflamación, dependiendo de su estructura y función.\nSu uso en cosmética ha crecido por su eficacia y buena tolerancia, convirtiéndose en una alternativa o complemento a ingredientes como los retinoides.\n## Tipos de péptidos\nExisten diferentes categorías según su mecanismo de acción:\n### Péptidos señal\nEstimulan la síntesis de colágeno, elastina y otros componentes de la matriz extracelular. Mejoran la firmeza y reducen arrugas finas.\n### Péptidos transportadores\nFacilitan la entrada de minerales esenciales como el cobre, necesarios para procesos de reparación y regeneración.\n### Péptidos inhibidores\nActúan relajando la contracción muscular superficial, suavizando líneas de expresión. Son una alternativa cosmética a los tratamientos médico-estéticos.\n### Péptidos con acción antiinflamatoria\nAyudan a reducir irritación, rojeces y estrés oxidativo, mejorando la tolerancia de la piel.\n## Beneficios de los péptidos\n- Mejoran la firmeza y elasticidad.\n- Estimulan la síntesis de colágeno y elastina.\n- Reducen arrugas finas y líneas de expresión.\n- Favorecen la reparación cutánea.\n- Mejoran la función barrera.\n- Disminuyen la inflamación y el estrés oxidativo.\n## Factores de crecimiento\nLos factores de crecimiento son proteínas que actúan como señales biológicas para estimular la regeneración celular. Intervienen en la reparación de tejidos, la producción de colágeno y la mejora de la firmeza.\nSe utilizan en cosmética para potenciar la renovación cutánea, mejorar la textura y acelerar la recuperación tras tratamientos exfoliantes o retinoides.\n## Cómo actúan\nLos factores de crecimiento se unen a receptores específicos en la superficie celular, activando procesos de reparación y síntesis de proteínas estructurales. Esto se traduce en una piel más firme, uniforme y resistente.\n## Indicaciones principales\n- Pérdida de firmeza\n- Arrugas finas y líneas de expresión\n- Textura irregular\n- Piel apagada o envejecida\n- Recuperación tras exfoliantes o retinoides\n## Cómo utilizarlos\nLos péptidos y factores de crecimiento pueden aplicarse por la mañana o por la noche, según la rutina y el tipo de piel. Funcionan bien combinados con antioxidantes, hidratantes y retinoides, siempre respetando la tolerancia individual.\nSu uso continuado mejora la firmeza, la luminosidad y la calidad global de la piel."},
 {"id": "rutina", "name": "Protocolo Cosmético Paso a Paso", "d": "Rutina de día y de noche.", "t": "## Rutina de día\nLa rutina de día se centra en proteger la piel, mantener la hidratación y reforzar la barrera cutánea. El objetivo es preparar la piel para la exposición ambiental y prevenir el daño oxidativo.\n- 1. **Limpieza suave:** Retira secreciones nocturnas y prepara la piel. En piel grasa funcionan mejor los limpiadores jabonosos; en piel seca, las emulsiones o aceites.\n- 2. **Loción hidratante o calmante:** Aporta agua y minerales esenciales, mejora la barrera cutánea y aumenta la tolerancia a los activos posteriores.\n- 3. **Antioxidantes:** Protegen frente a radiación UV, luz visible y contaminación. La vitamina C, la niacinamida o el resveratrol son opciones habituales.\n- 4. **Hidratante:** Combina humectantes, emolientes y lípidos reparadores para mantener la piel flexible y protegida.\n- 5. **Protección solar:** Paso imprescindible. Debe aplicarse generosamente y reaplicarse si hay exposición prolongada.\n## Rutina de noche\nLa rutina nocturna se orienta a la reparación, renovación celular y tratamiento intensivo. Es el momento ideal para aplicar activos más potentes.\n- 1. **Doble limpieza:** Primer paso oleoso para retirar maquillaje, protector solar y suciedad lipófila. Segundo paso acuoso para eliminar restos hidrosolubles y polución.\n- 2. **Loción hidratante:** Restablece el nivel de agua y mejora la tolerancia a los tratamientos posteriores.\n- 3. **Activos específicos:** Según las necesidades de la piel:\n- Retinoides para renovación celular y arrugas.\n- Hidroxiácidos para exfoliación y luminosidad.\n- Despigmentantes para manchas.\n- Péptidos para firmeza y reparación.\n- 4. **Hidratante reparadora:** Aporta ceramidas, colesterol y ácidos grasos para reforzar la barrera cutánea durante la noche."}],
