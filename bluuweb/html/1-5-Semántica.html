<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semántica</title>
</head>
<body>
    <!-- Con el header le decimos a nuestro documento que esta será la cabecera de nuestro sitio web -->
    <header>
        <p>Logo corporativo</p>
    </header>
    <!-- La etiqueta <nav></nav> hace referencia al menú de navegación de nuestro sitio web. -->
    <nav>
        <a href="#">Inicio</a>
        <a href="#">Contacto</a>
        <a href="#">Sobre nosotros</a>
    </nav>
    <!-- En la etiqueta section podría haber un slider, párrafos, etc -->
    <section>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Laborum sapiente ratione eveniet sint voluptas est aliquid cum repellat, officia, explicabo nisi aliquam optio deserunt deleniti quasi facilis atque corrupti. Id.</p>
    </section>
    <!-- El aside es la parte lateral de nuestro sitio web, HTML lo escribe de arriba hacia abajo, lo que le dará el estilo final será nuestra hoja de estilos css -->
    <aside>
        <p>Publicidad</p>
    </aside>
    <!-- El footer es el pie de página de nuestro sitio web -->
    <footer>
        <p>Pie de página</p>
    </footer>
</body>
</html>
