<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Columnas</title>

    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
      
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
</head>
<body>

    <div class="container">
        <div class="row">
            <div class="col s2 blue">1</div>
        </div>
   
        <div class="row">
            <div class="col s6 blue">Columna de 6 espacios azul</div>
            <div class="col s6 red">Columna de 6 espacios roja</div>
            <div class="col s12 pink">Columna de 12 espacios rosa</div>
        </div>
        <div class="row"> 
            <div class="col s3 yellow">3</div>
            <div class="col s6 orange">4</div>
            <div class="col s3 blue">3</div>
        </div>
        <div class="row"> 
            <div class="col s12 m3 yellow">3</div>
            <div class="col s12 m6 orange">4</div>
            <div class="col s12 m3 blue">3</div>
        </div>
    </div>
    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
            
</body>
</html>
